name: Build and Push to Yandex Container Registry

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 3. Собираем Docker-образ и пушим его в облако
      - name: Build and Push Docker Image
        env:
          CR_REGISTRY: ayn-registry.cr.cloud.ru
          CR_REPOSITORY: simple-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker login $CR_REGISTRY -u ${{ secrets.CR_USER_ID }} -p ${{ secrets.CR_USER_SECRET }}
          docker build -t $CR_REGISTRY/$CR_REPOSITORY:$IMAGE_TAG .
          docker build -t $CR_REGISTRY/$CR_REPOSITORY:latest .
          docker push $CR_REGISTRY/$CR_REPOSITORY:$IMAGE_TAG
          docker push $CR_REGISTRY/$CR_REPOSITORY:latest
